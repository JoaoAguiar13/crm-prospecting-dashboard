name: demo
# Publica a demo estática no GitHub Pages a cada push para main.
# Em Settings → Pages, a fonte tem de ser "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # Não se publica uma demo de código que não passa nos testes.
      - run: npm test
      - run: node scripts/construir-demo.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4