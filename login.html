  <form id="fcod" style="display:none" autocomplete="on">
    <label class="rot" for="email">Email de trabalho</label>
    <input class="campo" id="email" name="email" type="email" required autocomplete="email" placeholder="nome@empresa.example">
    <label class="rot" for="codigo">Código de acesso</label>
    <input class="campo" id="codigo" name="codigo" type="password" required autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="btn" type="submit" id="bcod">Entrar</button>
  </form>
  <div id="gbtn"></div>
  <div class="msg" id="msg"></div>
  <div class="dica" id="dica" style="display:none"></div>
</div>
<script>
const msg=t=>{const m=document.getElementById('msg');m.textContent=t;m.style.display='block';};
async function init(){
  const me=await fetch('/api/auth').then(r=>r.json());
  if(me.email){location.replace('/');return;}

  /*
   * O servidor e' que manda no modo. Enquanto o cliente OAuth recusar as
   * nossas origens (`origin_mismatch`), o servico corre com ACCESS_CODE e
   * entra-se por codigo partilhado + email; tirar essa variavel devolve o
   * Google, sem mexer aqui.
   */
  if(me.modo==='codigo'){
    const f=document.getElementById('fcod');
    f.style.display='block';

    /*
     * Link que entra sozinho: /login?e=<email>&c=<codigo>. Existe porque
     * escrever um codigo partilhado a meio de uma demonstracao e' onde isto
     * falha — o browser preenche o campo por conta propria, o codigo vem com
     * um espaco do copiar/colar, ou simplesmente nao ha tempo. Continua a ser
     * a mesma autenticacao: o servidor valida o codigo e o dominio na mesma.
     */
    const q=new URLSearchParams(location.search);
    if(q.get('c')){
      document.getElementById('email').value=q.get('e')||'';
      document.getElementById('codigo').value=q.get('c');
      const r=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({email:q.get('e')||'',codigo:q.get('c')})});
      if(r.ok){location.replace('/');return;}
      msg((await r.json()).error||'Nao foi possivel entrar.');
    }
    document.getElementById('email').focus();
    f.addEventListener('submit',async e=>{
      e.preventDefault();
      const b=document.getElementById('bcod');b.disabled=true;
      try{
        const r=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},
          body:JSON.stringify({email:document.getElementById('email').value,codigo:document.getElementById('codigo').value})});
        if(r.ok){location.replace('/');return;}
        msg((await r.json()).error||'Nao foi possivel entrar.');
      }catch(err){msg('Sem ligacao ao servidor.');}
      b.disabled=false;
    });
    const d=document.getElementById('dica');
    d.textContent=`Entrada por codigo enquanto a origem ${location.origin} nao estiver autorizada no Google. So entram contas @${me.dominio} ou na lista de acessos.`;
    d.style.display='block';
    return;
  }

  if(!me.clientId){msg('GOOGLE_CLIENT_ID não está configurado no serviço.');return;}
  /*
   * `hd` faz o Google oferecer so' contas do nosso dominio no selector, o que
   * evita o engano de escolher a conta pessoal. Nao e' uma barreira de
   * seguranca — o token continua a ser verificado em api/auth.js.
   *
   * Quem decide se se filtra e' o servidor, porque so' ele sabe a lista de
   * acessos: com alguem de fora do dominio na lista, filtrar fecharia-lhe a
   * porta, porque o Google nem lhe oferece a conta.
   */
  google.accounts.id.initialize({client_id:me.clientId,...(me.filtrarPorDominio?{hd:me.dominio}:{}),callback:async res=>{
    const r=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({credential:res.credential})});
    if(r.ok)location.replace('/');else msg((await r.json()).error||'Erro no login.');
  }});
  google.accounts.id.renderButton(document.getElementById('gbtn'),{theme:'outline',size:'large',width:264,locale:'pt-PT'});

  /*
   * Não há forma de detectar daqui uma origem não autorizada, e vale a pena
   * dizer porquê para ninguém voltar a tentar: a biblioteca só o escreve na
   * consola DO IFRAME dela (que tem console próprio, fora do alcance da
   * página); `prompt()` não chama de volta nesse caso; e o botão renderiza
   * exactamente igual ao caso bom — mesmo iframe, mesma altura. Testei os três.
   *
   * O que sobra é dizer à pessoa o que procurar. É pouco, mas é a diferença
   * entre "isto está avariado" e "falta autorizar a origem" — e este modo de
   * falha já custou tempo duas vezes (app da UniLinkr, e esta migração).
   */
  const dica=document.getElementById('dica');
  if(dica){dica.textContent=`Se o botão não fizer nada, a origem ${location.origin} pode não estar autorizada no cliente OAuth do Google.`;dica.style.display='block';}
}
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="init()" onerror="init()"></script>
<script>addEventListener('DOMContentLoaded',()=>{if(!window.google)setTimeout(()=>{if(!window.google)init();},1500);});</script>
